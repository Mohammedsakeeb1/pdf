<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge PDF - PDF Toolkit</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/merge.css">
    
    <!-- PDF Libraries -->
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner-professional"></div>
        <h4 id="loadingText">Processing PDF...</h4>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-glass sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">

                    <path d="M4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H4zm.165 11.668c.09-.18.23-.343.438-.493a15.783 15.783 0 0 1 1.557-1.096 8.586 8.586 0 0 0-1.028-1.566c-.444-.59-.627-1.033-.692-1.456-.065-.42.03-.852.29-1.2.26-.35.638-.503 1.03-.519.39-.015.753.158 1.031.506.258.32.404.762.463 1.25.06.488.01 1.033-.158 1.588.207.394.487.803.81 1.202a15.54 15.54 0 0 1 1.482-1.06c.303-.19.63-.39 1.03-.547.446-.177.94-.271 1.422-.24.48.03.893.188 1.155.487.26.3.384.695.332 1.137-.052.441-.31.939-.78 1.285-.47.345-1.1.531-1.767.511a12.89 12.89 0 0 1-2.436-.453c-.392.592-.86 1.164-1.354 1.658-.014.014-.027.028-.04.041L8.04 14.69c-.301.302-.603.586-.908.835-.278.226-.596.435-.947.517-.35.082-.733.062-1.05-.128-.319-.19-.476-.524-.512-.865-.035-.34.062-.712.214-1.02.153-.307.362-.613.623-.844.27-.238.561-.43.86-.577l.062-.029z"/>
                </svg>
                PDF Toolkit
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="merge.html">Merge PDF</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="split.html">Split PDF</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Wrapper -->
    <main class="main-wrapper">
        <div class="container">
            <div class="text-center mb-5">
                <h1 class="display-5 fw-bold text-indigo">Merge PDF Files</h1>
                <p class="text-muted">Combine multiple PDF files into one single document in seconds.</p>
            </div>
            
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="card-custom">
                        <!-- Hidden File Input -->
                        <input type="file" id="fileInput" multiple accept=".pdf" hidden>
                        
                        <!-- Professional Upload Zone -->
                        <div class="upload-zone text-center" id="dropZone">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="upload-icon mx-auto">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
                            </svg>
                            <h4 class="mb-2">Drag & drop PDF files here</h4>
                            <p class="text-muted mb-3">or click to browse from your device</p>
                            <button type="button" class="btn btn-primary" id="browseBtn">Choose Files</button>
                        </div>

                        <!-- File List -->
                        <div id="fileList" class="file-list">
                            <!-- Files will be listed here dynamically -->
                        </div>

                        <!-- Action Buttons (Hidden by default) -->
                        <div id="actionContainer" class="mt-4 text-center d-none">
                            <button id="mergeBtn" class="btn btn-primary btn-lg w-100">Merge PDF Now</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p class="mb-0">&copy; 2024 PDF Toolkit. Built with privacy in mind. No files ever leave your device.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Main JS -->
    <script src="js/app.js"></script>
    <!-- Merge JS -->
    <script src="js/merge.js"></script>
</body>
</html>
